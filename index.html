<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <!-- Pinch-zoom is left enabled on purpose (accessibility). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4edff">
  <meta name="description" content="SUMAS Quiz Arena: practice questions, progress tracking and tournaments for Nigerian university students.">
  <title>SUMAS Quiz Arena</title>
  <!-- Apply the saved theme before first paint so there's no flash. Light is the default. -->
  <script>
    try { var t = localStorage.getItem("sumas_theme") === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#0e1230" : "#e4edff"); } catch (e) {}
  </script>
  <link rel="icon" type="image/x-icon" href="/icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/poppins-regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/poppins-bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="banner" class="banner-slot" aria-live="polite"></div>
  <div id="app">
    <header id="topbar" class="topbar" hidden></header>
    <main id="view" tabindex="-1"></main>
    <nav id="nav" class="nav" aria-label="Main" hidden></nav>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">SUMAS Quiz Arena needs JavaScript. Please turn it on in your browser.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
